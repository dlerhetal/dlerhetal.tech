<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Process Map</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header class="top">
  <div class="toprow">
    <h1><span data-client-name>Process Map</span><small class="h1sub" id="h1sub" hidden>Process map</small></h1>
    <div class="who" id="whoToggle" title="Who is answering" hidden>
      <span class="wholbl">Answering:</span>
      <span id="whoButtons"></span>
    </div>
  </div>
  <div class="sub" id="appSub" hidden>
    <span id="saveState" class="saved">Loading your answers</span>
    <span class="links"><a href="../">Home</a><span data-dale-slot="wizard"></span><a href="#" data-action="signout">Sign out</a></span>
  </div>
</header>

<section id="gate" hidden>
  <main class="narrow">
    <form id="gateForm" class="card login-card" autocomplete="off">
      <label for="gatePassword" class="biglabel">Password</label>
      <input id="gatePassword" type="password" class="bigin" autocomplete="current-password">
      <p class="err" id="gateError"></p>
      <button type="submit" class="btn pri wide" id="gateBtn">Sign in</button>
      <p class="pdesc">Your answers are saved as you go. Stop any time and pick up later on any phone or computer.</p>
    </form>
  </main>
</section>

<section id="app" hidden>
  <section class="strip-wrap" id="stripWrap">
    <button type="button" class="strip-toggle" id="stripToggle" aria-expanded="true"><span id="stripCount"></span><span class="strip-hint">Tap to open the map</span></button>
    <div class="strip-tally" id="stripTally"></div>
    <div class="strip" id="strip"></div>
  </section>

  <main class="narrow" id="main">
    <div class="card qcard" id="intro" hidden>
      <p class="qsub" id="introStage"></p>
      <p class="donetext" id="introText"></p>
      <button type="button" class="btn big pri wide" id="btnStart">Let's start</button>
    </div>
    <div class="card qcard" id="qcard">
      <p class="resume" id="resumeCue" hidden></p>
      <div class="qhead">
        <span class="qstage" id="qStage"></span>
        <span class="qprog" id="qProg"></span>
      </div>
      <h2 class="qtext" id="qText"></h2>
      <p class="qsub" id="qSub"></p>
      <div class="qbody" id="qBody"></div>
      <p class="qmeta" id="qMeta"></p>
    </div>
    <div class="card qcard" id="editcard" hidden>
      <div class="qhead"><span class="qstage" id="editStage"></span></div>
      <h2 class="qtext">This step</h2>
      <p class="qsub">Change the words, move it, or take it out of the list.</p>
      <textarea class="bigta" id="editText" rows="3"></textarea>
      <div class="btnrow editrow">
        <button type="button" class="btn pri" id="btnEditSave">Save the new name</button>
        <button type="button" class="btn" id="btnEditUp">Move up</button>
        <button type="button" class="btn" id="btnEditDown">Move down</button>
        <button type="button" class="btn danger" id="btnEditDelete">Take this step out</button>
      </div>
      <p class="pdesc" id="editMsg"></p>
      <div class="btnrow editrow">
        <button type="button" class="btn pri" id="btnEditGo">Answer the questions about this step</button>
        <button type="button" class="btn" id="btnEditBack">Back</button>
      </div>
    </div>
    <div class="navbar" id="navBar">
      <div class="navrow">
        <button type="button" class="btn big" id="btnBack">Back</button>
        <button type="button" class="btn big pri" id="btnNext">Next</button>
      </div>
      <p class="navmeta"><span id="navState" class="navstate"></span><span class="navhint" id="navHint"></span></p>
    </div>
  </main>
</section>

<footer data-consultant></footer>
<script src="../assets/shell.js"></script>
<script src="../assets/wizard.js"></script>
</body>
</html>
