<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Process Map</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="top">
  <div class="toprow">
    <h1><span data-client-name>Client</span> tools</h1>
  </div>
  <div class="sub" id="appSub" hidden>
    <span class="saved">Signed in</span>
    <span class="links"><a href="#" data-action="signout">Sign out</a></span>
  </div>
</header>

<main class="narrow">
  <section id="gate" hidden>
    <form id="gateForm" class="card login-card" autocomplete="off">
      <label for="gatePassword" class="biglabel">Password</label>
      <input id="gatePassword" type="password" class="bigin" autocomplete="current-password">
      <p class="err" id="gateError"></p>
      <button type="submit" class="btn pri wide" id="gateBtn">Sign in</button>
      <p class="pdesc">One password opens every tool on this page. You stay signed in on this device for thirty days.</p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="tiles" id="tiles"></div>
    <div data-dale-slot="hub"></div>
  </section>
</main>

<footer data-consultant></footer>
<script src="assets/shell.js"></script>
<script>
(function () {
  /* Tiles are generic tool entries; add more here as tools are added for a client.
     Empty slots are simply not shown. A tile with "progress" shows how far the
     answers have got, read from the API after sign-in. */
  var TILES = [
    { title: "Process Map", desc: "Walk me through one well in your own words; the map builds as you go. Come back any time, your answers are saved.", href: "map/", progress: true },
    { title: "QuickBooks fixes", desc: "One card for each problem in the QuickBooks file, with step by step fixes. Every choice is saved as you go.", href: "qb/", qbprogress: true }
  ];
  RAM.gate(function (cfg) {
    document.getElementById("appSub").hidden = false;
    var box = document.getElementById("tiles"); box.innerHTML = "";
    TILES.forEach(function (t, i) {
      if (!t || !t.title) return;
      box.appendChild(RAM.el('<a class="tile" href="' + RAM.esc(t.href) + '"><span class="ttitle">' + RAM.esc(t.title) + '</span><span class="tdesc">' + RAM.esc(t.desc || "") + '</span>' + ((t.progress || t.qbprogress) ? '<span class="tprog none" id="tprog' + i + '">Checking your answers</span>' : "") + '</a>'));
    });
    TILES.forEach(function (t, i) {
      if (!t || !t.qbprogress) return;
      RAM.apiJSON("/qb/state").then(function (r) {
        var e = document.getElementById("tprog" + i); if (!e || !r || !r.summary) return;
        var s = r.summary;
        e.textContent = s.done + " of " + s.cards + " done" + (s.open_asks ? ", " + s.open_asks + " questions open" : "");
        e.className = "tprog" + ((s.done || s.working) ? "" : " none");
      }).catch(function () { var e = document.getElementById("tprog" + i); if (e) e.textContent = ""; });
    });
    if (TILES.some(function (t) { return t && t.progress; })) {
      RAM.apiJSON("/answers").then(function (r) {
        var c = RAM.progress(r);
        TILES.forEach(function (t, i) {
          if (!t || !t.progress) return;
          var e = document.getElementById("tprog" + i); if (!e) return;
          e.textContent = c.line;
          e.className = "tprog" + (c.started ? "" : " none");
        });
      }).catch(function () {
        Array.prototype.forEach.call(document.querySelectorAll(".tprog"), function (e) { e.textContent = ""; });
      });
    }
  });
})();
</script>
</body>
</html>
