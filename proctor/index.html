<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E1525" />
  <meta name="description" content="Proctor — drill and master the AWS Certified AI Practitioner (AIF-C01) exam. Works offline." />
  <title>Proctor — AWS AI Practitioner Prep</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/favicon.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Proctor" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="install-banner" class="install-banner" hidden>
    <span>Install Proctor for offline study</span>
    <div>
      <button id="install-btn" class="btn btn-sm">Install</button>
      <button id="install-dismiss" class="btn btn-sm btn-ghost">Later</button>
    </div>
  </div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">P</span>
      <div>
        <div class="brand-name">Proctor</div>
        <div class="brand-sub">AWS AI Practitioner · AIF-C01</div>
      </div>
    </div>
    <div class="header-stats">
      <div class="hstat" title="Total XP"><span id="hx-xp">0</span><small>XP</small></div>
      <div class="hstat" title="Day streak"><span id="hx-streak">0</span><small>🔥</small></div>
    </div>
  </header>

  <main id="view" class="view">
    <div class="loading">Loading your command center…</div>
  </main>

  <nav class="tabbar">
    <button class="tab" data-view="dashboard">
      <span class="tab-ico">◎</span><span class="tab-label">Home</span>
    </button>
    <button class="tab" data-view="drill">
      <span class="tab-ico">⚔</span><span class="tab-label">Drill</span>
    </button>
    <button class="tab" data-view="exam">
      <span class="tab-ico">⏱</span><span class="tab-label">Exam</span>
    </button>
    <button class="tab" data-view="tracker">
      <span class="tab-ico">✓</span><span class="tab-label">Tracker</span>
    </button>
    <button class="tab" data-view="audio">
      <span class="tab-ico">♪</span><span class="tab-label">Audio</span>
    </button>
  </nav>

  <script src="./js/storage.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
